# ============================================================
# 仪度六壬择日 仪表盘 部署配置（阿里云 单域名 souhuertong.net.cn）
# 后端：stock_dashboard.py (Flask) 监听 127.0.0.1:5555
# 前端：stock_dashboard.py 直接吐 stock_dashboard.html（无需单独静态目录）
# ============================================================
#
# 方案 A（推荐，零代码改造）：子域名 liuren.souhuertong.net.cn
#   - 仍是你"一个域名"下，阿里云免费加子域名
#   - 仪表盘用绝对 /api/...，子域名根路径正好匹配，不用改任何接口路径
#   - 与寒假守护完全隔离，独立证书/运维
#
# 方案 B（坚持"放进寒假守护站内"）：子路径 souhuertong.net.cn/liuren/
#   - 需把前端 48 处 /api/ 改成前缀感知（见文件末尾说明），否则接口会打到根路径 404
#   - 不推荐，坑多
# ============================================================

# ---------- 方案 A：子域名 ----------
server {
    listen 80;
    server_name liuren.souhuertong.net.cn;

    # 如需 HTTPS，取消下面两行注释并配置证书路径
    # listen 443 ssl;
    # ssl_certificate /path/to/liuren.souhuertong.net.cn.pem;
    # ssl_certificate_key /path/to/liuren.souhuertong.net.cn.key;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------- 方案 B：子路径（仅当坚持"放进站内"时使用）----------
# server {
#     listen 80;
#     server_name souhuertong.net.cn;
#
#     # 寒假守护 主站（假设你原来已有的配置，保持不变）
#     location / {
#         # ... 原有寒假守护配置 ...
#     }
#
#     # 六壬择日 挂在 /liuren/ 下
#     # 注意：proxy_pass 末尾带 "/" 会剥掉 /liuren 前缀，
#     #       所以 Flask 收到的仍是 /api/...（无需 Flask url_prefix）。
#     #       但浏览器里前端 fetch('/api/...') 是绝对路径，会打到 souhuertong.net.cn/api/ 而 404！
#     #       故子路径方案必须：① 前端所有 /api/ 改为 /liuren/api/（前缀感知），
#     #                         ② 且本 location 改为 proxy_pass http://127.0.0.1:5555; （不带末尾 /）
#     #                         ③ 并在前端 <head> 注入 <base href="/liuren/"> 或设置全局 APP_PREFIX='/liuren'
