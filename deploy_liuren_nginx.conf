#         proxy_pass http://127.0.0.1:5555;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_read_timeout 120s;
#     }
# }

# ============================================================
# 子路径方案 B 的前端正前缀改造要点（如选 B 才需要做）：
#   1) 在 stock_dashboard.html <head> 注入：
#        <script>window.APP_PREFIX = '/liuren';</script>
#   2) 全文件 48 处 fetch('/api/...') 改为 fetch((window.APP_PREFIX||'') + '/api/...')
#      —— 可用 sed 批量：
#        sed -i "s#fetch('/api/#fetch((window.APP_PREFIX||'')+'/api/#g" stock_dashboard.html
#   3) 后端 Flask 给所有路由加 url_prefix='/liuren'（或在 proxy 用 rewrite 剥离）。
#   推荐直接用方案 A，省去以上全部。
# ============================================================
