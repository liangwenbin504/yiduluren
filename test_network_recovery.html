<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络恢复模块测试</title>
    <script src="network_recovery.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            margin-top: 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }
        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            min-height: 40px;
        }
        .log {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-item {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #f5576c;
            padding-left: 10px;
        }
        .network-status {
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .online {
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid #4caf50;
        }
        .offline {
            background: rgba(244, 67, 54, 0.3);
            border: 2px solid #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 网络请求恢复模块测试</h1>
        
        <div id="networkStatus" class="network-status online">
            🟢 网络在线
        </div>
        
        <div class="test-section">
            <h2>📊 队列状态</h2>
            <div id="queueStatus">点击按钮测试</div>
            <button onclick="showQueueStatus()">查看队列状态</button>
            <button onclick="clearQueue()">清空队列</button>
            <button onclick="clearCache()">清空缓存</button>
        </div>
        
        <div class="test-section">
            <h2>🧪 功能测试</h2>
            <button onclick="testSuccess()">✅ 成功请求</button>
            <button onclick="testNetworkError()">🔴 网络错误</button>
            <button onclick="testTimeout()">⏱️ 超时请求</button>
            <button onclick="testIdempotency()">🔄 幂等性测试</button>
        </div>
        
        <div class="test-section">
            <h2>📝 日志输出</h2>
            <div id="log" class="log"></div>
        </div>
    </div>
    
    <script>
        // 初始化网络恢复模块
        const networkRecovery = new NetworkRequestRecovery({
            maxRetries: 3,
            retryInterval: 2000,
            exponentialBackoff: true,
            timeout: 5000,
            enableQueue: true,
            enableIdempotency: true,
            debug: false
        });
        
        // 设置回调
        networkRecovery.setCallbacks({
            onQueued: (data) => {
                addLog(`📦 请求已入队：${data.requestId}, 队列长度：${data.queueLength}`);
                updateNetworkStatus();
            },
            onRetry: (data) => {
                addLog(`🔄 重试请求：${data.requestId} (第${data.retryCount}次，延迟${Math.round(data.delay)}ms)`);
            },
            onSuccess: (data) => {
                addLog(`✅ 请求成功：${data.requestId}, 重试次数：${data.retries}`);
            },
            onError: (data) => {
                addLog(`❌ 请求失败：${data.requestId}, 错误：${data.error.message}`);
            },
            onRecover: (data) => {
                addLog(`🟢 网络已恢复`);
                updateNetworkStatus();
            },
            onOffline: (data) => {
                addLog(`🔴 网络已断开`);
                updateNetworkStatus();
            }
        });
        
        // 更新网络状态显示
        function updateNetworkStatus() {
            const statusEl = document.getElementById('networkStatus');
            const queueStatusEl = document.getElementById('queueStatus');
            
            if (networkRecovery.isOnline) {
                statusEl.textContent = '🟢 网络在线';
                statusEl.className = 'network-status online';
            } else {
                statusEl.textContent = '🔴 网络断开';
                statusEl.className = 'network-status offline';
            }
            
            showQueueStatus();
        }
        
        // 显示队列状态
        function showQueueStatus() {
            const status = networkRecovery.getQueueStatus();
            document.getElementById('queueStatus').innerHTML = `
                <strong>队列长度:</strong> ${status.queueLength}<br>
                <strong>处理中:</strong> ${status.processingCount}<br>
                <strong>已完成:</strong> ${status.completedCount}<br>
                <strong>网络状态:</strong> ${status.isOnline ? '🟢 在线' : '🔴 断开'}
            `;
        }
        
        // 清空队列
        function clearQueue() {
            networkRecovery.clearQueue();
            addLog('🗑️ 队列已清空');
            showQueueStatus();
        }
        
        // 清空缓存
        function clearCache() {
            networkRecovery.clearCompletedCache();
            addLog('🗑️ 缓存已清空');
        }
        
        // 添加日志
        function addLog(message) {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.textContent = `[${timestamp}] ${message}`;
            logEl.appendChild(logItem);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        // 测试成功请求
        async function testSuccess() {
            addLog('📡 发送成功请求测试...');
            try {
                const result = await networkRecovery.request({
                    url: 'https://jsonplaceholder.typicode.com/todos/1',
                    method: 'GET'
                });
                addLog('✅ 请求成功：' + JSON.stringify(result));
            } catch (error) {
                addLog('❌ 请求失败：' + error.message);
            }
        }
        
        // 测试网络错误
        async function testNetworkError() {
            addLog('📡 发送网络错误请求测试...');
            try {
                const result = await networkRecovery.request({
                    url: 'http://invalid-url-test.local/api/test',
                    method: 'GET'
                });
                addLog('✅ 请求成功：' + JSON.stringify(result));
            } catch (error) {
                addLog('❌ 请求最终失败：' + error.message);
            }
        }
        
        // 测试超时请求
        async function testTimeout() {
            addLog('📡 发送超时请求测试...');
            try {
                const result = await networkRecovery.request({
                    url: 'https://httpstat.us/200?sleep=10000',
                    method: 'GET'
                });
                addLog('✅ 请求成功：' + JSON.stringify(result));
            } catch (error) {
                addLog('❌ 请求超时：' + error.message);
            }
        }
        
        // 测试幂等性
        async function testIdempotency() {
            addLog('🔄 测试幂等性 - 发送 3 个相同的请求...');
            
            const promises = [];
            for (let i = 0; i < 3; i++) {
                promises.push(networkRecovery.request({
                    url: 'https://jsonplaceholder.typicode.com/todos/1',
                    method: 'GET'
                }));
            }
            
            const results = await Promise.all(promises);
            addLog(`✅ 收到 ${results.length} 个响应，其中 ${results.filter((r, i, arr) => arr.indexOf(r) === i).length} 个是唯一的`);
        }
        
        // 监听网络状态变化
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        // 初始化
        updateNetworkStatus();
        addLog('🚀 网络恢复模块测试页面已加载');
    </script>
</body>
</html>
