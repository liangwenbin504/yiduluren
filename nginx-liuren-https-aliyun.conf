# ============================================================
# 仪度六壬择日 仪表盘 HTTPS 配置（阿里云证书版，备选方案）
# 后端：stock_dashboard.py (Flask/waitress) 监听 127.0.0.1:5555
# 证书：阿里云免费证书（数字证书管理服务下载的 Nginx 格式）
#       放置路径：/etc/nginx/certs/liuren.souhuertong.net.cn.pem / .key
# 部署：先跑 deploy_aliyun_cert.sh（自动复制证书 + 部署本配置 + 重载 nginx）
# ============================================================

# ---------- 80 端口：全部 301 跳转到 HTTPS ----------
server {
    listen 80;
    server_name liuren.souhuertong.net.cn;
    return 301 https://$host$request_uri;
}

# ---------- 443 端口：HTTPS 主配置 ----------
server {
    # 兼容 Ubuntu 23.04 自带 nginx 1.24（http2 需写在 listen 里）
    listen 443 ssl http2;
    server_name liuren.souhuertong.net.cn;

    # 阿里云证书（deploy_aliyun_cert.sh 从 /opt/liuren/certs/ 复制而来）
    ssl_certificate     /etc/nginx/certs/liuren.souhuertong.net.cn.pem;
    ssl_certificate_key /etc/nginx/certs/liuren.souhuertong.net.cn.key;

    # 现代安全基线
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
