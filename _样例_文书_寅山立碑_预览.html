    <div class="title">仪度六壬·立碑择日课格</div>
    <div class="opening">伏以，天地定位，山向合机；理气相通，福泽攸关。谨奉《穿山透地真传》之旨，依《仪度六壬选日要诀》之法，为孝眷择取立碑吉期，安妥先灵，庇荫后昆。</div>
    <div class="line">仙命：甲子</div>
    <div class="line">坐山：寅</div>
    <div class="line">向山：午</div>
    <div class="line">来龙：巽龙</div>
    <div class="line">择取岁次丙午年乙未月甲子日丙寅时</div>
    <div class="line">批语：课传拱贵，禄马临身，山向得气，宜安葬立碑，福荫绵长。</div>
    <div class="line">避忌事宜：无重大避忌</div>

<script>
window.addEventListener('load', function(){
  var paper = document.querySelector('.paper');
  var target = document.querySelector('.seal-target');
  var seal = document.querySelector('.seal-fixed');

  // 印章压「月…日」定位
  if (target && seal && paper) {
    var r = target.getBoundingClientRect();
    var pr = paper.getBoundingClientRect();
    seal.style.left = (r.left - pr.left + (r.width - seal.offsetWidth) / 2) + 'px';
    seal.style.top = (r.top - pr.top + (r.height - seal.offsetHeight) / 2) + 'px';
  }

  // 自适应缩字：正文太多溢出纸张时，逐档缩小正文字号（下限 13px），同步缩小行距
  var content = document.querySelector('.content');
  var footer = document.querySelector('.footer');
  if (content && footer && paper) {
    var fs = 19;
    var minFs = 13;
    function overflowed() {
      var pr = paper.getBoundingClientRect();
      var cr = content.getBoundingClientRect();
      var fr = footer.getBoundingClientRect();
      return cr.left < pr.left - 1 || cr.right > pr.right + 1 ||
             cr.top < pr.top - 1 || cr.bottom > pr.bottom + 1 ||
             fr.left < pr.left - 1 || fr.right > pr.right + 1;
    }
    while (overflowed() && fs > minFs) {
      fs -= 1;
      paper.style.setProperty('--fs', fs + 'px');
    }
  }
});
</script>
