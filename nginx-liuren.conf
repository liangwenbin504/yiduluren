# liuren dashboard - HTTP + HTTPS (no forced redirect, no CSP/HSTS)
# cert: Let's Encrypt liuren.souhuertong.net.cn (auto renew via certbot.timer)

server {
    listen 80;
    server_name liuren.souhuertong.net.cn;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name liuren.souhuertong.net.cn;

    ssl_certificate /etc/letsencrypt/live/liuren.souhuertong.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liuren.souhuertong.net.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
