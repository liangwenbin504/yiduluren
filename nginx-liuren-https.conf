# ============================================================
# 仪度六壬择日 仪表盘 HTTPS 配置（2026-08-20 已部署版）
# 后端：stock_dashboard.py (Flask/waitress) 监听 127.0.0.1:5555
# 证书：Let's Encrypt liuren.souhuertong.net.cn（certbot.timer 自动续期）
#       /etc/letsencrypt/live/liuren.souhuertong.net.cn/fullchain.pem + privkey.pem
# 服务器路径：/etc/nginx/conf.d/liuren.conf（云助手部署，见 _swas_deploy/scripts/remote_cmd.py）
#
# ⚠️ 设计要点（吸取 2026-08-17 教训）：
#   1. 80 端口不强制 301 跳转 HTTPS —— HTTP/HTTPS 双通道并存，老书签不受影响
#   2. 不加 CSP / HSTS 头 —— 曾导致仪表盘异常被回退
#   3. 注意：liuren.souhuertong.net（无.cn）是 NXDOMAIN，
#      如需支持须先在 souhuertong.net 域名控制台添加 A 记录 → 47.96.132.253
#      再 certbot --expand 扩展证书并往两个 server 块追加该域名
# ============================================================

# ---------- 80 端口：直接反代（不跳转） ----------
server {
    listen 80;
    server_name liuren.souhuertong.net.cn;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------- 443 端口：HTTPS（nginx 1.18 语法） ----------
server {
    listen 443 ssl http2;
    server_name liuren.souhuertong.net.cn;

    ssl_certificate /etc/letsencrypt/live/liuren.souhuertong.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liuren.souhuertong.net.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
