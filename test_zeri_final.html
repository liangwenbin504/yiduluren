<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安葬吉課</title>
    <style>
        body {
            font-family: "楷体", "KaiTi", "楷体_GB2312", "STKaiti", serif;
            background: #f5e6c8;
            padding: 20px;
        }
        
        .page {
            width: 900px;
            height: 1250px;
            background: #faf0d8;
            border: 3px solid #8b5a2b;
            margin: 0 auto;
            position: relative;
        }
        
        .border-inner {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            border: 2px solid #a07850;
        }
        
        .content {
            position: absolute;
            top: 60px;
            left: 60px;
            right: 60px;
            bottom: 60px;
            writing-mode: vertical-rl;
            -webkit-writing-mode: vertical-rl;
            direction: rtl;
            font-size: 52px;
            line-height: 2.2;
        }
        
        .col {
            display: inline-block;
            margin-left: 45px;
            vertical-align: top;
        }
        
        .title {
            font-family: "黑体", "SimHei", "STHeiti", sans-serif;
            font-size: 68px;
            font-weight: bold;
            color: #8b0000;
        }
        
        .red {
            color: #8b0000;
            font-weight: bold;
        }
        
        .small {
            font-size: 38px;
        }
        
        .seal {
            position: absolute;
            bottom: 90px;
            left: 100px;
            width: 95px;
            height: 95px;
            border: 4px solid #8b0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "篆书", "小篆", "隶书", serif;
            font-size: 26px;
            color: #8b0000;
            transform: rotate(-15deg);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="border-inner"></div>
        <div class="content">
            <div class="col title">安葬吉課</div>
            <div class="col">壬山丙向<br>仙命亥</div>
            <div class="col">丙午年<br>己亥月<br>己亥日<br>甲子时</div>
            <div class="col"><span class="red">宜</span><br>安葬、修娶、入宅、交易</div>
            <div class="col"><span class="red">忌</span><br>嫁安、稳稳、福荫、后人</div>
            <div class="col">地理人<br>清虚竹子<br>谨择</div>
            <div class="col small">公元贰零贰陆年三月廿九</div>
        </div>
        <div class="seal">擇<br>吉</div>
    </div>
</body>
</html>
